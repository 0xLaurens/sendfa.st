name: Run tests
on:
  pull_request:
    branches:
      - dev
      - main
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Run Worker tests
        run: bun run test:worker
      - name: Run frontend regressions
        run: bun run test:frontend
      - name: Build frontend
        run: bun run build
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup golang
        uses: actions/setup-go@v4
        with:
          go-version: ">=1.22.5"
      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install dependencies
        run: |
          cd backend/
          go mod tidy
      - name: Run tests
        run: |
          cd backend/
          go test -v ./...
