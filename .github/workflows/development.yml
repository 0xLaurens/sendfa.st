name: Run tests
on:
  pull_request:
    branches:
      - dev
      - main
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Run Worker tests
        run: bun run test:worker
      - name: Run frontend regressions
        run: bun run test:frontend
      - name: Build frontend
        run: bun run build
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup golang
        uses: actions/setup-go@v4
        with:
          go-version: ">=1.22.5"
      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install dependencies
        run: |
          cd backend/
          go mod tidy
      - name: Run tests
        run: |
          cd backend/
          go test -v ./...
  dependabot-merge:
    name: Merge eligible Dependabot patch
    needs: [frontend, run-test]
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.base_ref == 'main' &&
      startsWith(github.head_ref, 'dependabot/bun/frontend/') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Verify the update's commit and files
        id: scope
        run: |
          commits=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/commits?per_page=2")
          files=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=3")
          if jq -e --arg sha "$HEAD_SHA" 'length == 1 and
              all(.[]; .sha == $sha and .author.login == "dependabot[bot]" and .commit.verification.verified)' <<< "$commits" &&
            jq -e 'length <= 2 and any(.[]; .filename == "frontend/bun.lock") and
              all(.[]; .status == "modified" and
                (.filename == "frontend/bun.lock" or .filename == "frontend/package.json"))' <<< "$files"; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'The PR falls outside the automatic merge scope.'
          fi
      - name: Read Dependabot metadata
        if: steps.scope.outputs.eligible == 'true'
        id: metadata
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7
      - name: Verify patch version and publication age
        if: >-
          steps.scope.outputs.eligible == 'true' &&
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          steps.metadata.outputs.dependency-group == '' &&
          !contains(steps.metadata.outputs.dependency-names, ',')
        id: release
        shell: bash
        env:
          PACKAGE: ${{ steps.metadata.outputs.dependency-names }}
          PREVIOUS_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
        run: |
          stable='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! $PREVIOUS_VERSION =~ $stable || ! $NEW_VERSION =~ $stable ||
              ${PREVIOUS_VERSION%.*} != "${NEW_VERSION%.*}" ||
              ${NEW_VERSION##*.} -le ${PREVIOUS_VERSION##*.} ]]; then
            exit 0
          fi

          package=$(jq -nr --arg name "$PACKAGE" '$name | @uri')
          published=$(curl -fsS --max-time 20 "https://registry.npmjs.org/$package" |
            jq -r --arg version "$NEW_VERSION" '.time[$version] // empty')
          [[ -n $published ]] || exit 0
          published_at=$(date -u -d "$published" +%s%N)
          cutoff=$(date -u -d '24 hours ago' +%s%N)
          if [[ $published_at -le $cutoff ]]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for PR checks and merge the tested commit
        if: steps.release.outputs.eligible == 'true'
        run: |
          for attempt in {1..20}; do
            checks=$(gh pr checks "$PR_NUMBER" --json name,workflow,state,bucket |
              jq '[.[] | select(.name != "Merge eligible Dependabot patch" or .workflow != "Run tests")]')
            if jq -e 'any(.[]; .bucket == "fail" or .bucket == "cancel")' <<< "$checks" > /dev/null; then
              echo 'A PR check failed or was canceled. Leaving the PR open.'
              exit 0
            fi
            if jq -e 'any(.[]; .workflow == "Run tests" and .name == "frontend" and .state == "SUCCESS") and
                any(.[]; .workflow == "Run tests" and .name == "run-test" and .state == "SUCCESS") and
                all(.[]; .state == "SUCCESS")' <<< "$checks" > /dev/null; then
              gh api --method PUT "repos/$GH_REPO/pulls/$PR_NUMBER/merge" \
                -f "sha=$HEAD_SHA" -f merge_method=squash --jq '.merged' | grep -qx true
              exit 0
            fi
            sleep 10
          done
          echo 'Some PR checks did not report success. Leaving the PR open.'
