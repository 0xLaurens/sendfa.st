name = "sendfast-signaling"
main = "index.ts"
compatibility_date = "2026-07-09"

[vars]
ALLOWED_ORIGINS = "http://localhost:4321"
MAX_ROOM_PEERS = "8"
MAX_MESSAGE_BYTES = "65536"
CREATIONS_PER_MINUTE = "10"
UPGRADES_PER_MINUTE = "30"
SIGNALS_PER_SECOND = "60"
SIGNAL_BURST = "120"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[env.staging]
name = "sendfast-signaling-staging"

[env.staging.vars]
ROOM_CLEANUP_DIAGNOSTICS = "true"
ROOM_WAKE_DIAGNOSTICS = "true"
ALLOWED_ORIGINS = "https://sendfast-staging.laurens-weterings.workers.dev"
MAX_ROOM_PEERS = "8"
MAX_MESSAGE_BYTES = "65536"
CREATIONS_PER_MINUTE = "10"
UPGRADES_PER_MINUTE = "30"
SIGNALS_PER_SECOND = "60"
SIGNAL_BURST = "120"

[[env.staging.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[env.staging.observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1

[env.staging.observability.traces]
enabled = false
